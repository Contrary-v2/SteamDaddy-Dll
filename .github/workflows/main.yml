name: Build
run-name: ${{ github.event.inputs.version }} Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S src -B build -G "Ninja Multi-Config" -DOPENSTEAMTOOL_VERSION="${{ github.event.inputs.version }}"

      - name: Build Release
        run: |
          cmake --build build --config Release
          cmake --build build --config Release --target ost-manager

      - name: Build Debug
        run: |
          cmake --build build --config Debug
          cmake --build build --config Debug --target ost-manager

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSteamTool-Release
          path: build/Release/

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSteamTool-Debug
          path: build/Debug/

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          {
            echo 'changelog<<EOF'
            git log -1 --pretty=format:"- %s%n%b"
            echo ''
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Package Release
        run: 7z a OpenSteamTool-${{ github.event.inputs.version }}-Release.zip ".\build\Release\*" -mx5

      - name: Package Debug
        run: 7z a OpenSteamTool-${{ github.event.inputs.version }}-Debug.zip ".\build\Debug\*" -mx5

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ## **extract_tickets Build / Release:** [OpenSteamTool Actions Workflow](https://github.com/mmxlyo/OpenSteamTool/actions/workflows/tools.yml)

            ## Installation & Usage

            Download `OpenSteamTool-${{ github.event.inputs.version }}-Release.zip` (or the `-Debug` variant if you need verbose file logging).

            ### Method 1: Portable Mode (Recommended)
            No files copied to the Steam directory; runs completely green and portable:
            1. Extract the release package to any standalone folder outside the Steam directory.
            2. Place your Lua unlock scripts in `config/lua/` inside that folder.
            3. Run `ost-manager.exe`:
               - **One-shot Launch / Inject**: Click "Launch & Inject Steam" in the GUI or execute `ost-manager.exe /inject` via CLI.
               - **Portable IFEO Interception**: Click "Install IFEO (Portable Mode)"; launching Steam normally will automatically trigger zero-window injection.
               - **Auto-Start Watcher**: Click "Start Background Watcher" to start background monitoring on login (no administrator privileges needed, registry key `ost_watcher`), or run `ost-manager.exe /watch` via CLI.

            ### Method 2: Steam Root Dedicated Mode
            In `ost-manager.exe`, click "Install IFEO (Steam Root)":
            - Automatically deploys `OpenSteamTool.dll` and dedicated loader `ost-loader.exe` to Steam root.
            - Binds IFEO so double-clicking official Steam directly triggers instant injection via the lightweight loader.
            - Allows one-click clean uninstallation at any time via "Uninstall IFEO".

            ### Method 3: Standard DLL Proxy Mode (Traditional Hijacking / Manual Placement)
            For environments where IFEO registry modification is restricted or not preferred:
            - **Using Manager**: In `ost-manager.exe`, click "Deploy Standard DLL" (or run `ost-manager.exe /deploy-dll <SteamDir> <PayloadDll>`). Cleanly removable at any time via "Remove DLL" (or `ost-manager.exe /remove-dll <SteamDir>`).
            - **Manual Placement**:
              - `OpenSteamTool.dll`: Copy directly to Steam root directory (e.g. `C:\Program Files (x86)\Steam\OpenSteamTool.dll`)
              - `version.dll`: Copy directly to Steam root directory (e.g. `C:\Program Files (x86)\Steam\version.dll`)
              - `dwmapi.dll`: Copy to Steam `bin` subfolder (e.g. `C:\Program Files (x86)\Steam\bin\dwmapi.dll`, **not** in root!)
              - Lua unlock scripts: Place in `<Steam>\config\lua\`
            - Launching official Steam normally will automatically load OpenSteamTool via Windows PE dynamic library forwarding.
          files: |
            OpenSteamTool-${{ github.event.inputs.version }}-Release.zip
            OpenSteamTool-${{ github.event.inputs.version }}-Debug.zip

